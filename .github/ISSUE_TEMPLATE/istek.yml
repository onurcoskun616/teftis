name: İstek
description: Programda değişiklik isteyin ya da bir hatayı bildirin
title: "[İstek] "
labels: ["istek"]
body:
  - type: textarea
    id: istek
    attributes:
      label: İsteğiniz
      description: Neyi, nerede istediğinizi kendi cümlelerinizle yazın. Kişisel bilgi (T.C. no, işçi/işveren adı, adres) yazmayın; bu sayfa herkese açıktır.
    validations:
      required: true
  - type: dropdown
    id: adim
    attributes:
      label: Hangi bölümle ilgili? (isteğe bağlı)
      options:
        - İşyeri listesi / görev listesi yükleme
        - Görev ve künye
        - İşçi ifadeleri
        - Evrak isteme bildirimi
        - 1. Aşama tutanak / tespitler
        - Noksanlık bildirimi
        - 2. Aşama tutanak
        - Rapor
        - Tespit kataloğu / ayarlar
        - Diğer
  - type: textarea
    id: ek
    attributes:
      label: Belge veya ekran görüntüsü (isteğe bağlı)
      description: Dosyayı bu kutuya sürükleyip bırakın. Önce kişisel bilgileri silin ya da karartın.
