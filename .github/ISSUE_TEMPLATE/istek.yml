name: İstek veya hata bildirimi
description: Programda değişiklik isteyin ya da bir hatayı bildirin — Claude işleyip size önizleme linki yazar
title: "[İstek] "
labels: ["istek"]
body:
  - type: markdown
    attributes:
      value: |
        İsteğinizi yazın; Claude **en geç bir saat içinde** işleyip bu sayfanın altına yorum olarak cevap verir (önizleme linki ya da sorusu). Cevabı denedikten sonra yine buraya yorum yazarak devam edebilirsiniz.

        ⚠️ **Bu sayfa herkese açıktır.** T.C. kimlik numarası, işçi/işveren adı, adres gibi bilgileri yazmayın. Belge ekleyecekseniz önce bu bilgileri silin ya da karartın.
  - type: dropdown
    id: tur
    attributes:
      label: Tür
      options:
        - Yeni özellik / tespit
        - Belgede yanlış ya da eksik metin
        - Hata (program çalışmıyor, donuyor, yanlış hesaplıyor)
        - Diğer
    validations:
      required: true
  - type: dropdown
    id: adim
    attributes:
      label: Programın hangi bölümü?
      options:
        - İşyeri listesi / görev listesi yükleme
        - Görev ve künye
        - İşçi ifadeleri
        - Evrak isteme bildirimi
        - 1. Aşama tutanak / tespitler
        - Noksanlık bildirimi
        - 2. Aşama tutanak
        - Rapor
        - Tespit kataloğu / ayarlar
        - Diğer
  - type: textarea
    id: istek
    attributes:
      label: Ne istiyorsunuz ya da ne oldu?
      description: Neyi, nerede istediğinizi yazın (hangi adım, hangi bölüm, hangi cümle). Mümkünse olması gereken metni de yazın.
    validations:
      required: true
  - type: textarea
    id: ornek
    attributes:
      label: Örnek metin veya belge (isteğe bağlı)
      description: Olması gereken cümle, mevzuat maddesi vb. Belge, PDF, Excel ya da ekran görüntüsünü bu kutuya sürükleyip bırakarak ekleyebilirsiniz. Kişisel bilgileri önce silin.
