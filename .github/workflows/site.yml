name: Site

# GitHub Pages sitesini oluşturur: canlı program (main), geliştirici sayfası ve her dalın önizlemesi.
# Ayarlar → Pages → Source: "GitHub Actions" seçili olmalıdır.
on:
  push:
    branches: [main]
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tüm dalları al
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Siteyi oluştur
        run: node tools/site-olustur.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@v4
